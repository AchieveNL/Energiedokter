<svg
  viewBox="0 0 1200 500"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="none"
>
  <defs>
    <!-- Left green -->
    <radialGradient id="g1" cx="15%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#dff3e8"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Top center yellow -->
    <radialGradient id="g2" cx="50%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#f9f7d3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Right blue -->
    <radialGradient id="g3" cx="85%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d9f1f6"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Bottom yellow-green -->
    <radialGradient id="g4" cx="60%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#e7f2b8"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Base color -->
  <rect width="100%" height="100%" rx="40" fill="#eef8f1"/>

  <!-- Layers -->
  <rect width="100%" height="100%" rx="40" fill="url(#g1)" />
  <rect width="100%" height="100%" rx="40" fill="url(#g2)" />
  <rect width="100%" height="100%" rx="40" fill="url(#g3)" />
  <rect width="100%" height="100%" rx="40" fill="url(#g4)" />
</svg>
